<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Number Adventure: Make Ten</title>
<style>
:root{--ink:#16233a;--muted:#627086;--paper:#f6f4ef;--surface:#fffdfa;--cobalt:#2f64d6;--cobalt-dark:#214796;--coral:#ef6b57;--sun:#f3b847;--line:#d8dde6;--focus:#7b4dcc;--good:#24714d;--bad:#a04b43}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Trebuchet MS",Arial,sans-serif;letter-spacing:.005em}body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,transparent 0,transparent calc(50% - 460px),#dfe3eb55 calc(50% - 460px),transparent calc(50% - 459px)),repeating-linear-gradient(0deg,transparent 0 31px,#dbe0e855 32px);opacity:.5}.app{max-width:1180px;margin:auto;padding:20px clamp(16px,4vw,48px) 48px}header{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;padding:5px 0 22px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:15px}.logo{display:grid;place-items:center;width:58px;height:58px;background:var(--coral);border:3px solid var(--ink);border-radius:14px;color:#fff;font-size:2rem;box-shadow:5px 5px 0 var(--ink);transform:rotate(-3deg)}.brand h1{margin:0;font:700 clamp(2rem,4.5vw,3.8rem)/.92 Georgia,"Times New Roman",serif;letter-spacing:-.055em}.brand p{margin:8px 0 0;color:var(--muted);font-size:.92rem;letter-spacing:.035em}.toolbar,.nav,.choices,.actions,.scaffolds{display:flex;gap:10px;flex-wrap:wrap}.toolbar button,.nav button,.choice,.primary,.secondary,.scaffold,.answer{min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 16px;cursor:pointer;font:inherit;transition:background .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease}.toolbar button{min-height:40px;border-radius:999px;color:var(--muted);padding:7px 13px;background:transparent}.toolbar button:hover{color:var(--ink);border-color:var(--ink)}.nav{margin:22px 0 16px;padding:7px;background:#e5e8ee;border:1px solid #cfd5df;border-radius:14px;box-shadow:0 4px 0 #ccd2dc}.nav button{flex:1;text-align:left;background:transparent;border-color:transparent;color:#4c5870;font-weight:700}.nav button:hover{background:#ffffffaa;color:var(--ink)}.nav button[aria-current=true]{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:4px 4px 0 #aeb7c5}.panel{background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--line);border-radius:28px;padding:clamp(22px,4vw,48px);box-shadow:0 18px 45px #26344b16;min-height:590px}.panel h2{margin:0 0 4px;font:700 clamp(2rem,4vw,3.8rem)/.98 Georgia,"Times New Roman",serif;letter-spacing:-.045em;text-wrap:balance}.prompt{max-width:720px;background:transparent;border-left:0;border-top:3px solid var(--cobalt);padding:12px 0 0;margin:12px 0 28px;color:#47546b;font-size:1.06rem}.intro-grid,.two-col{display:grid;grid-template-columns:minmax(220px,.72fr) minmax(0,1.28fr);gap:22px}.card{background:#f0eee8;border:1px solid #d9d4ca;border-radius:18px;padding:19px}.card strong{display:block;font-size:1.1rem;letter-spacing:.015em}.big-number{display:grid;place-items:center;width:150px;height:150px;margin:14px auto 18px;border:2px solid var(--ink);border-radius:50%;background:var(--sun);font:700 5.2rem/.9 Georgia,serif;box-shadow:8px 8px 0 var(--ink);color:var(--ink)}.frame-wrap{max-width:760px;margin:18px auto;background:var(--ink);border-radius:18px;padding:16px;box-shadow:8px 8px 0 #cbd1dc}.ten-frame{display:grid;grid-template-columns:repeat(5,minmax(48px,1fr));gap:10px;background:#f4f0e7;padding:12px;border-radius:11px;border:1px solid #aeb7c5}.slot{min-height:78px;border:2px dashed #8a98aa;border-radius:8px;background:#fff;display:grid;place-items:center;cursor:pointer;position:relative}.slot:hover{border-color:var(--cobalt);transform:translateY(-2px)}.slot.has{border-style:solid;border-color:var(--coral);background:#ffe3dc}.counter{width:45px;height:45px;border-radius:50%;background:var(--coral);border:4px solid #b84639;box-shadow:inset 0 3px #ffffff88,2px 3px 0 #913a34}.slot.removed{background:#e6e8ec}.slot.removed .counter{opacity:.28;filter:grayscale(1)}.count-label{text-align:center;font:700 1rem/1.2 Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px}.story-objects{display:flex;flex-wrap:wrap;gap:8px;min-height:62px;align-items:center;background:#f0eee8;border:1px solid #d9d4ca;padding:14px;border-radius:14px}.story-objects .counter{width:42px;height:42px}.story-counter{padding:0;cursor:pointer}.story-counter.marked{outline:3px solid var(--focus);outline-offset:3px}.choices{justify-content:center;margin:16px 0}.answer{min-width:72px;min-height:58px;font-size:1.25rem;font-weight:700}.answer:hover,.choice:hover,.secondary:hover,.scaffold:hover{border-color:var(--cobalt);background:#f2f5ff}.answer[aria-pressed=true],.scaffold[aria-pressed=true]{outline:3px solid var(--focus);outline-offset:2px;background:#e7e1ff;border-color:var(--focus)}.primary{background:var(--cobalt);border-color:var(--cobalt-dark);color:#fff;box-shadow:4px 4px 0 var(--cobalt-dark);font-weight:700}.primary:hover{background:#3b72e4;transform:translate(-1px,-1px)}.secondary{background:transparent;border-color:#a9b4c4;color:var(--ink)}button:disabled{opacity:.43;cursor:not-allowed;box-shadow:none;transform:none}.feedback{min-height:44px;border-top:1px solid var(--line);padding-top:12px;margin-bottom:0;font-weight:700;color:var(--good)}.feedback.bad{color:var(--bad)}.hint{background:#fff5d4;border:1px solid #ebce77;border-left:5px solid var(--sun);border-radius:10px;padding:13px 15px;margin:14px 0}.actions{justify-content:space-between;align-items:center;margin-top:25px;padding-top:18px;border-top:1px solid var(--line)}.status-text{color:var(--muted);font-size:.93rem}.scaffolds{align-items:center;margin:14px 0}.scaffold{min-height:42px;padding:7px 12px}.complete{text-align:center}.complete .emoji{font-size:4.5rem}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.summary .card{text-align:center}.summary .card strong{font:700 2rem/1 Georgia,serif;color:var(--cobalt)}a{color:var(--cobalt-dark)}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}@media(max-width:700px){.app{padding:14px 12px 32px}.brand h1{font-size:2.35rem}.intro-grid,.two-col{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.panel{border-radius:20px;padding:22px 17px;min-height:0}.nav{overflow:auto;flex-wrap:nowrap}.nav button{min-width:132px}.ten-frame{gap:6px;padding:8px}.slot{min-height:60px}.counter{width:36px;height:36px}.big-number{width:126px;height:126px;font-size:4.3rem}}@media(prefers-reduced-motion:reduce){*,*::before,*:after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body><div class="app">
<header><div class="brand"><span class="logo" aria-hidden="true">🧭</span><div><h1>Number Adventure</h1><p>Build, split and solve numbers to ten</p></div></div><div class="toolbar"><button id="replay" type="button">🔊 Replay prompt</button><button id="mute" type="button" aria-pressed="false">🔇 Mute</button><button id="reset" type="button">↻ Reset</button></div></header>
<nav class="nav" aria-label="Lesson activities"><button data-view="start" aria-current="true">Start</button><button data-view="build">1 Build a quantity</button><button data-view="make">2 Make ten</button><button data-view="story">3 Story problems</button></nav>
<main id="screen" aria-live="polite"></main><p id="status" role="status" style="position:absolute;left:-10000px"></p>
</div>
<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const st={view:"start",muted:false,scaffold:1,build:{i:0,targets:[0,3,7,10,5],done:0,slots:Array(10).fill(false),msg:""},make:{i:0,bonds:[0,2,3,5,6,7,8],filled:0,done:0,msg:""},story:{i:0,done:0,hint:0,final:false,msg:""}};
const stories=[
["Lina has 3 shells. She finds 2 more on the beach. How many shells does she have now?",3,2,"+",5,"3 + 2 = 5"],
["Omar builds a tower with 8 blocks. He takes away 3 blocks. How many blocks stay?",8,3,"−",5,"8 − 3 = 5"],
["Mia sees 4 red kites and 4 blue kites. How many kites are there altogether?",4,4,"+",8,"4 + 4 = 8"],
["Noah has 9 stickers and gives 4 to a friend. How many stickers does he keep?",9,4,"−",5,"9 − 4 = 5"],
["Sora collects 2 smooth stones, then collects 6 more. How many stones did Sora collect?",2,6,"+",8,"2 + 6 = 8"],
["Kai has 7 toy cars and parks 2 away. How many cars are still here?",7,2,"−",5,"7 − 2 = 5"]
];
const finalStory=["Ari has 6 red beads. Ari gives away 2, then finds 3 more. How many beads does Ari have now?",7,"6 − 2 + 3 = 7"];
const prompt={start:"Welcome! Choose a calm scaffold, then start the adventure.",build:"Tap counters into the ten-frame until it matches the target.",make:"Complete the ten-frame. Count the empty spaces to find the missing part.",story:"Use the picture and counters, then choose the answer.",complete:"You finished every activity. Tell someone how you know each answer."};
function say(t){if(st.muted||!("speechSynthesis" in window))return;speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}
function announce(t){$("#status").textContent=t}
function nav(){ $$("[data-view]").forEach(b=>b.setAttribute("aria-current",b.dataset.view===st.view?"true":"false"))}
function shell(title,body){return '<section class="panel"><h2>'+title+'</h2><p class="prompt">'+prompt[st.view]+'</p>'+body+'</section>'}
function scaffold(){return '<div class="scaffolds" aria-label="Choose a scaffold"><span>Help level:</span>'+[[0,"I will try"],[1,"A little hint"],[2,"Show a strategy"]].map(x=>'<button type="button" class="scaffold" data-scaffold="'+x[0]+'" aria-pressed="'+(st.scaffold===x[0])+'">'+x[1]+'</button>').join("")+'</div>'}
function frame(slots,removed=[]){return '<div class="ten-frame" role="group" aria-label="Ten-frame with ten slots">'+slots.map((has,i)=>'<button type="button" class="slot '+(has?"has ":"")+(removed.includes(i)?"removed":"")+'" data-slot="'+i+'" aria-label="Slot '+(i+1)+', '+(removed.includes(i)?"removed":has?"has a counter":"empty")+'" aria-pressed="'+has+'">'+(has?'<i class="counter" aria-hidden="true"></i>':removed.includes(i)?'<span aria-hidden="true">×</span>':"")+'</button>').join("")+'</div>'}
function common(){nav();$$("[data-view]").forEach(b=>b.onclick=()=>{st.view=b.dataset.view;render()});$("#replay").onclick=()=>say(prompt[st.view]);$("#mute").onclick=()=>{st.muted=!st.muted;$("#mute").setAttribute("aria-pressed",st.muted);$("#mute").textContent=st.muted?"🔇 Unmute":"🔇 Mute";announce(st.muted?"Read-aloud muted":"Read-aloud on")};$("#reset").onclick=()=>location.reload();$$("[data-scaffold]").forEach(b=>b.onclick=()=>{st.scaffold=+b.dataset.scaffold;render()})}
function start(){let body='<div class="intro-grid"><div class="card"><strong>Today’s mission</strong><p>Connect numbers to amounts, find number bonds to ten, and solve little addition and subtraction stories.</p><p>No timer, lives or leaderboard. Tap, think and try again.</p></div><div class="card"><strong>For grown-ups</strong><p>Play together for about 8–12 minutes. Ask “How do you know?” and let the learner move or tap the counters.</p><p>Choose help at any time; it never labels the learner.</p></div></div>'+scaffold()+'<div class="actions"><span class="status-text">Progress stays in this page until Reset.</span><button class="primary" id="begin" type="button">Start the adventure</button></div>';$("#screen").innerHTML=shell("Ready to explore numbers?",body);$("#begin").onclick=()=>{st.view="build";render()};common()}
function build(){let target=st.build.targets[st.build.i],filled=st.build.slots.filter(Boolean).length,body='<div class="two-col"><div><h3>Target</h3><div class="big-number" aria-label="Target '+target+'">'+target+'</div><p>Make exactly '+target+' counters. Zero means the frame stays empty; ten fills every slot.</p></div><div><h3>Your ten-frame</h3><div class="frame-wrap">'+frame(st.build.slots)+'</div><p class="count-label">'+filled+' of 10 counters</p></div></div>'+scaffold()+'<p class="feedback">'+(st.build.msg||"Tap a slot to add or remove one counter.")+'</p><div class="checkline"><button class="primary" id="checkBuild" type="button">Check my quantity</button></div><div class="actions"><span class="status-text">Round '+(st.build.i+1)+' of '+st.build.targets.length+'</span><button class="secondary" id="nextBuild" type="button" '+(st.build.msg.startsWith("Correct")?"":"disabled")+'>'+(st.build.i===st.build.targets.length-1?"Continue to make ten":"Next target")+'</button></div>';$("#screen").innerHTML=shell("1. Build a quantity",body);$$("[data-slot]").forEach(b=>b.onclick=()=>{st.build.slots[+b.dataset.slot]=!st.build.slots[+b.dataset.slot];st.build.msg="";render()});$("#checkBuild").onclick=()=>{if(filled===target){st.build.msg="Correct! "+target+" is shown by "+target+" counters.";st.build.done=Math.max(st.build.done,st.build.i+1);render()}else{st.build.msg=filled<target?"Count the "+(target-filled)+" empty slot"+(target-filled===1?"":"s")+" you still need.":"Take away "+(filled-target)+" counter"+(filled-target===1?"":"s")+" to reach "+target+".";render()}};$("#nextBuild").onclick=()=>{if(!st.build.msg.startsWith("Correct"))return;if(st.build.i<st.build.targets.length-1){st.build.i++;st.build.slots=Array(10).fill(false);st.build.msg="";render()}else{st.view="make";render()}};common()}
function make(){let start=st.make.bonds[st.make.i],need=10-start,filled=st.make.filled,slots=Array.from({length:10},(_,i)=>i<start||i<start+filled),hint=st.scaffold===0?"Try counting the open spaces.":st.scaffold===1?"There are "+need+" empty spaces. The missing part fills them.":"Start with "+start+". Count up until ten: "+Array.from({length:need},(_,i)=>start+i+1).join(", ")+".",body='<div class="two-col"><div><h3>Starting collection</h3><div class="big-number">'+start+'</div><p>Starting with '+start+', add counters until the whole is ten.</p><div class="card"><strong>Equation so far</strong><p class="big-equation">'+start+' + '+filled+' = '+(start+filled)+'</p></div></div><div><h3>Complete the ten-frame</h3><div class="frame-wrap">'+frame(slots)+'</div><p class="count-label">'+filled+' added · '+need+' needed</p></div></div><div class="hint" role="note">'+hint+'</div>'+scaffold()+'<p class="feedback">'+(st.make.msg||"Tap empty slots to add the missing counters.")+'</p><div class="checkline"><button class="primary" id="checkMake" type="button">Check the whole</button></div><div class="actions"><span class="status-text">Bond '+(st.make.i+1)+' of '+st.make.bonds.length+'</span><button class="secondary" id="nextMake" type="button" '+(st.make.msg.startsWith("Correct")?"":"disabled")+'>'+(st.make.i===st.make.bonds.length-1?"Continue to stories":"Next number bond")+'</button></div>';$("#screen").innerHTML=shell("2. Make ten",body);$$("[data-slot]").forEach(b=>b.onclick=()=>{let i=+b.dataset.slot;if(i<start)return;let n=i-start+1;st.make.filled=st.make.filled===n?0:n;st.make.msg="";render()});$("#checkMake").onclick=()=>{if(filled===need){st.make.msg="Correct! "+start+" + "+need+" = 10.";st.make.done=Math.max(st.make.done,st.make.i+1);render()}else{st.make.msg=filled<need?"You need "+(need-filled)+" more counter"+(need-filled===1?"":"s")+".":"Ten has only "+need+" spaces after "+start+"; remove "+(filled-need)+".";render()}};$("#nextMake").onclick=()=>{if(!st.make.msg.startsWith("Correct"))return;if(st.make.i<st.make.bonds.length-1){st.make.i++;st.make.filled=0;st.make.msg="";render()}else{st.view="story";render()}};common()}
function objects(s,fin){if(fin)return '<div class="story-objects" aria-label="Six beads, two crossed out, then three new beads">'+Array.from({length:6},(_,i)=>'<button type="button" class="story-counter counter '+(i>=4?"removed":"")+'" aria-label="Bead '+(i+1)+'" aria-pressed="false"></button>').join("")+'<span aria-hidden="true">＋</span>'+Array.from({length:3},(_,i)=>'<button type="button" class="story-counter counter" aria-label="New bead '+(i+1)+'" aria-pressed="false"></button>').join("")+'</div>';let total=s[3]==="+"?s[1]+s[2]:s[1];return '<div class="story-objects" aria-label="Counters for the story">'+Array.from({length:total},(_,i)=>'<button type="button" class="story-counter counter '+(s[3]==="−"&&i>=s[4]?"removed":"")+'" aria-label="Counter '+(i+1)+'" aria-pressed="false"></button>').join("")+'</div>'}
function story(){let fin=st.story.final,s=stories[st.story.i],text=fin?finalStory[0]:s[0],ans=fin?finalStory[1]:s[4],eq=fin?finalStory[2]:s[5],choices=[Math.max(0,ans-2),Math.max(0,ans-1),ans,Math.min(10,ans+1),Math.min(10,ans+2)].filter((x,i,a)=>a.indexOf(x)===i),clue=st.story.hint===0?"Tap the counters as you count, then choose a number.":st.story.hint===1?(fin?"First take away two from six. Then add three.":s[3]==="+"?"Count the first group, then count on the second group.":"Start with the first group; cross out the ones that leave."):(fin?"6 − 2 leaves 4. Add 3 to get the final number.":eq+" is the number sentence.");let body='<p class="card"><strong>'+(fin?"Fresh final problem":"Problem "+(st.story.i+1)+" of "+stories.length)+'</strong>'+text+'</p><div class="two-col"><div><h3>Picture model</h3>'+objects(fin?null:s,fin)+'<p class="status-text">The picture is a guide; use it to count.</p></div><div><h3>Choose the answer</h3><div class="choices" role="group" aria-label="Answer choices">'+choices.map(x=>'<button type="button" class="answer" data-answer="'+x+'" aria-pressed="false">'+x+'</button>').join("")+'</div><p class="feedback">'+(st.story.msg||"Take your time.")+'</p></div></div><div class="hint" role="note">'+clue+'</div>'+scaffold()+'<div class="actions"><button class="secondary" id="hintBtn" type="button">Give me a hint</button><button class="primary" id="checkStory" type="button" disabled>Check answer</button></div>';$("#screen").innerHTML=shell("3. Story problems",body);$$((".story-counter")).forEach(b=>b.onclick=()=>{b.classList.toggle("marked");b.setAttribute("aria-pressed",b.classList.contains("marked"))});let selected=null;$$(("[data-answer]")).forEach(b=>b.onclick=()=>{selected=+b.dataset.answer;$$("[data-answer]").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));$("#checkStory").disabled=false});$("#hintBtn").onclick=()=>{st.story.hint=Math.min(2,st.story.hint+1);render()};$("#checkStory").onclick=()=>{if(selected===ans){st.story.msg=fin?"Excellent! You used two steps to find 7.":"Correct! "+eq+".";if(fin){st.story.done=stories.length+1}else if(st.story.i<stories.length-1){st.story.done++;st.story.i++;st.story.hint=0;st.story.msg=""}else{st.story.done++;st.story.final=true;st.story.hint=0;st.story.msg=""}render()}else{st.story.msg="Good try. Use the picture model and a helpful strategy, then try again.";render()}};common()}
function complete(){let body='<div class="complete"><div class="emoji" aria-hidden="true">🌟</div><h2>Adventure complete!</h2><p>You built quantities, found many ways to make ten, and solved six stories plus a fresh two-step problem.</p><div class="summary"><div class="card"><strong>'+st.build.done+'/'+st.build.targets.length+'</strong><span>quantity rounds</span></div><div class="card"><strong>'+st.make.done+'/'+st.make.bonds.length+'</strong><span>number bonds</span></div><div class="card"><strong>'+st.story.done+'/'+(stories.length+1)+'</strong><span>story problems</span></div></div><p>Next idea: make ten with household objects, then invent a new “give away and find” story together.</p><button class="primary" id="again" type="button">Play again</button></div>';$("#screen").innerHTML=shell("You did it!",body);$("#again").onclick=()=>location.reload();common()}
function render(){if(st.story.done>=stories.length+1)st.view="complete";nav();if(st.view==="start")start();else if(st.view==="build")build();else if(st.view==="make")make();else if(st.view==="story")story();else complete();say(prompt[st.view]);announce(prompt[st.view])}
render();
})();
</script></body></html>
