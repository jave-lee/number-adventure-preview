<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Little Garden: Shapes, Colours & Counting</title>
<style>
:root{--ink:#263238;--green:#2f7d58;--paper:#fffdf4}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#e6f8ee,#fffdf4 45%);color:var(--ink);font:16px/1.45 system-ui,sans-serif}.app{max-width:1000px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.brand{display:flex;gap:10px;align-items:center}.logo{font-size:3rem}.top h1{margin:0;font-size:clamp(1.5rem,4vw,2.4rem)}.top p{margin:.2rem 0;color:#496057}.controls,.steps,.choices,.beds,.dots,.numbers{display:flex;gap:10px;flex-wrap:wrap}.small,.step,.choice,.bed,.number,.dot,.primary{border:2px solid #b8cbbd;border-radius:14px;background:#fff;cursor:pointer;padding:11px 15px;font:inherit}.small{border-radius:999px}.steps{margin:22px 0 14px}.step{flex:1;font-weight:800;background:#d8e9dc}.step[aria-current=true],.primary{background:var(--green);color:#fff}.panel{background:#fffffff0;border:2px solid #d5e6d9;border-radius:24px;padding:clamp(18px,4vw,35px);box-shadow:0 12px 30px #466b5717}.panel h2{margin-top:0}.prompt{background:#dff3ff;padding:14px 18px;border-radius:16px}.stage{display:grid;grid-template-columns:1fr 1.4fr;gap:20px;align-items:center}.target{min-height:170px;background:#eee7ff;border-radius:18px;display:grid;place-items:center}.shape{width:90px;height:90px;display:inline-block;margin:14px}.circle{border-radius:50%}.triangle{width:0;height:0;border-left:50px solid transparent;border-right:50px solid transparent;border-bottom:90px solid currentColor}.red{background:#e85d75;color:#e85d75}.blue{background:#4d96ff;color:#4d96ff}.yellow{background:#f4b942;color:#f4b942}.green{background:#51a66e;color:#51a66e}.choice{min-width:86px;min-height:86px}.choice:focus-visible,.bed:focus-visible,.number:focus-visible,.dot:focus-visible,.small:focus-visible,.step:focus-visible,.primary:focus-visible{outline:4px solid #1d5fd1;outline-offset:3px}.bed{min-width:140px;min-height:100px}.bed.redbed{border-color:#e85d75}.bed.bluebed{border-color:#4d96ff}.object{min-width:85px;min-height:85px}.feedback{min-height:32px;font-weight:700;color:#39704f}.bad{color:#a0443e}.action{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px}.dots{justify-content:center;min-height:120px;align-items:center}.dot{width:72px;height:72px;border-radius:50%;background:#ffd166;border:4px solid #d89e22}.dot.on{transform:translateY(-10px);background:#ff9f68}.numbers{justify-content:center}.number{font-size:1.6rem;font-weight:800;width:80px}.complete{text-align:center;padding:25px}.big{font-size:4rem}@media(max-width:650px){.stage{grid-template-columns:1fr}.app{padding:12px}.panel{border-radius:18px}.shape{width:74px;height:74px;margin:10px}.triangle{border-left-width:42px;border-right-width:42px;border-bottom-width:76px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
:root{--ui-ink:#16233a;--ui-muted:#627086;--ui-paper:#f6f4ef;--ui-surface:#fffdfa;--ui-accent:#2f64d6;--ui-accent-dark:#214796;--ui-coral:#ef6b57;--ui-sun:#f3b847;--ui-line:#d8dde6;--ui-focus:#7b4dcc}
*{box-sizing:border-box}
body{background:var(--ui-paper)!important;color:var(--ui-ink)!important;font-family:"Trebuchet MS",Arial,sans-serif!important;letter-spacing:.005em}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 31px,#dbe0e855 32px);opacity:.45}
.wrap,main{max-width:1180px!important;margin:auto!important;padding:20px clamp(16px,4vw,48px) 48px!important}
.top,header{background:transparent!important;border:0!important;border-bottom:1px solid var(--ui-line)!important;border-radius:0!important;box-shadow:none!important;padding:5px 0 22px!important}
.top h1,h1{font:700 clamp(2rem,4.5vw,3.8rem)/.92 Georgia,"Times New Roman",serif!important;letter-spacing:-.055em!important;color:var(--ui-ink)!important}
.top p,header p,p{color:var(--ui-muted)}
nav,.steps,.tabs{margin:22px 0 16px!important;padding:7px!important;background:#e5e8ee!important;border:1px solid #cfd5df!important;border-radius:14px!important;box-shadow:0 4px 0 #ccd2dc!important}
button,.btn,.tab,.step,.choice,.bed,.number,.dot,.answer,.small{min-height:48px;border:1px solid var(--ui-line)!important;border-radius:10px!important;background:var(--ui-surface)!important;color:var(--ui-ink)!important;padding:10px 16px!important;font:inherit!important;cursor:pointer!important;transition:background .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease}
button:hover,.btn:hover,.tab:hover,.step:hover,.choice:hover,.bed:hover,.number:hover,.answer:hover{border-color:var(--ui-accent)!important;background:#f2f5ff!important}
.tab[aria-current=true],.step[aria-current=true],.btn.primary,.primary{background:var(--ui-ink)!important;border-color:var(--ui-ink)!important;color:#fff!important;box-shadow:4px 4px 0 #aeb7c5!important}
button:disabled{opacity:.43!important;cursor:not-allowed!important;box-shadow:none!important;transform:none!important}
.panel,.card{background:rgba(255,253,250,.94)!important;border:1px solid var(--ui-line)!important;border-radius:22px!important;box-shadow:0 14px 36px #26344b16!important}
.panel{padding:clamp(22px,4vw,48px)!important}
.panel h2,h2{font:700 clamp(2rem,4vw,3.5rem)/.98 Georgia,"Times New Roman",serif!important;letter-spacing:-.045em}
.prompt,.note,.hint,.summary{border-left:0!important;border-top:3px solid var(--ui-accent)!important;border-radius:12px!important;background:#f0eee8!important;padding:14px 16px!important}
.chart,.dotplot{border:1px solid #bfc8d6!important;border-radius:12px!important;background:#f4f0e7!important}
.bar,.point{background:var(--ui-accent)!important;border-radius:7px 7px 0 0!important}
.point.bias{background:var(--ui-coral)!important}
.feedback,.status{min-height:40px;border-top:1px solid var(--ui-line);padding-top:12px;color:#24714d!important;font-weight:700}
.bad,.warn{color:#a04b43!important}
.next,.action{margin-top:24px!important;padding-top:18px;border-top:1px solid var(--ui-line)}
:focus-visible{outline:3px solid var(--ui-focus)!important;outline-offset:3px}
@media(max-width:700px){.wrap,main{padding:14px 12px 32px!important}.panel{border-radius:20px!important;padding:22px 17px!important}.tabs,.steps,nav{overflow:auto;flex-wrap:nowrap}.tab,.step{min-width:132px}.grid,.sampleGrid,.chartWrap,.stage{grid-template-columns:1fr!important}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}</style></head>
<body><main class="app">
<header class="top"><div class="brand"><span class="logo" aria-hidden="true">🌱</span><div><h1>Little Garden</h1><p>Shapes, colours and counting for shared play</p></div></div><div class="controls"><button class="small" id="speak">🔊 Replay prompt</button><button class="small" id="mute" aria-pressed="false">🔇 Mute</button><button class="small" id="reset">↻ Reset</button></div></header>
<nav class="steps" aria-label="Activities"><button class="step" data-step="0" aria-current="true">1 Shape match</button><button class="step" data-step="1">2 Colour sort</button><button class="step" data-step="2">3 Tiny count</button></nav>
<section class="panel" id="screen" aria-live="polite"></section><p id="status" role="status" style="position:absolute;left:-9999px"></p>
</main>
<script>
(()=>{let step=0,round=0,done=[0,0,0],chosen=null,muted=0;const S=document.querySelector('#screen'),T=document.querySelector('#status'),P=['Find the same shape. Tap a choice.','Choose one colour, then tap its matching garden bed.','Count the glowing dots, then choose the number.'];const sh=['circle','square','triangle'],co=['red','blue','yellow'];const say=x=>{if(!muted&&speechSynthesis){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(x))}},shape=(x,c)=>x==='triangle'?'<i class="shape triangle '+c+'" aria-hidden="true"></i>':'<i class="shape '+x+' '+c+'" aria-hidden="true"></i>';function render(){document.querySelectorAll('.step').forEach((b,i)=>b.setAttribute('aria-current',i===step));if(done.every(Boolean)){S.innerHTML='<div class="complete"><div class="big">🌼</div><h2>Garden grown!</h2><p>You explored shapes, one-colour sorting and counting. Replay any activity or invent a new example together.</p><button class="primary" id="again">Play again</button></div>';again.onclick=()=>{done=[0,0,0];step=0;render()};return}T.textContent=P[step];say(P[step]);step?step===1?sort():count():match()}function match(){let target=sh[(round+1)%3];S.innerHTML='<h2>Find the matching shape</h2><p class="prompt">'+P[0]+'</p><div class="stage"><div class="target"><div><b>Garden stone</b>'+shape(target,'green')+'</div></div><div><div class="choices">'+sh.map((x,i)=>'<button class="choice" data-x="'+x+'" aria-label="'+x+'">'+shape(x,co[i])+'</button>').join('')+'</div><p class="feedback" id="f">Try one.</p></div></div><div class="action"><span>One gentle try at a time.</span><button class="primary" id="next" disabled>Next activity</button></div>';document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{let ok=b.dataset.x===target;f.textContent=ok?'That matches! 🌟':'Good try. Compare the sides and corners, then try again.';f.className='feedback '+(ok?'':'bad');if(ok){done[0]=1;next.disabled=0}});next.onclick=()=>{step=1;render()}}function sort(){let a=[['red','circle'],['blue','square'],['red','triangle'],['blue','circle']];S.innerHTML='<h2>Sort by one colour</h2><p class="prompt">Tap one fruit, then tap the garden bed with the same colour. Shape does not matter here.</p><div class="choices">'+a.map((x,i)=>'<button class="choice object" data-i="'+i+'" data-c="'+x[0]+'" aria-pressed="false" aria-label="'+x[0]+' fruit">'+shape(x[1],x[0])+'</button>').join('')+'</div><div class="beds"><button class="bed redbed" data-b="red">❤️ Red bed</button><button class="bed bluebed" data-b="blue">💙 Blue bed</button></div><p class="feedback" id="f">Choose a fruit.</p><div class="action"><span id="n">0 of 4 sorted</span><button class="primary" id="next" disabled>Next activity</button></div>';document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-i]').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');chosen=b});document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{if(!chosen){f.textContent='Tap a fruit first.';return}if(chosen.dataset.c===b.dataset.b){chosen.disabled=1;chosen=null;let k=document.querySelectorAll('[data-i]:disabled').length;n.textContent=k+' of 4 sorted';f.textContent='Nice sorting!';if(k===4){done[1]=1;next.disabled=0}}else f.textContent='Look at the colour cue on the fruit and beds.'});next.onclick=()=>{step=2;render()}}function count(){let total=round%3+1;S.innerHTML='<h2>Count the glowing dots</h2><p class="prompt">'+P[2]+'</p><div class="dots">'+Array.from({length:total},(_,i)=>'<button class="dot" data-d="'+i+'" aria-label="dot '+(i+1)+'"></button>').join('')+'</div><div class="numbers">'+[1,2,3].map(x=>'<button class="number" data-n="'+x+'">'+x+'</button>').join('')+'</div><p class="feedback" id="f">Count slowly.</p><div class="action"><span>Every arrangement is a fresh look.</span><button class="primary" id="next" disabled>Finish garden</button></div>';document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>b.classList.toggle('on'));document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{let ok=+b.dataset.n===total;f.textContent=ok?'Exactly! 🌼':'Try counting once more.';f.className='feedback '+(ok?'':'bad');if(ok){done[2]=1;next.disabled=0}});next.onclick=()=>{round++;step=0;render()}}document.querySelectorAll('.step').forEach(b=>b.onclick=()=>{step=+b.dataset.step;render()});reset.onclick=()=>{step=round=0;done=[0,0,0];chosen=null;render()};mute.onclick=e=>{muted=!muted;e.currentTarget.setAttribute('aria-pressed',muted);e.currentTarget.textContent=muted?'🔇 Unmute':'🔇 Mute'};speak.onclick=()=>say(P[step]);render()})();
</script></body></html>
