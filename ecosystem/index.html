<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living Ecosystem Lab</title>
<style>
:root{--ink:#163b38;--muted:#5a746e;--paper:#f2f5ef;--surface:#fbfcf8;--leaf:#2e7d62;--deep:#155447;--water:#2c7fa3;--orange:#e49b32;--rose:#cf6857;--line:#cbded5;--focus:#6743b5;--good:#24714d;--bad:#a04b43}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Trebuchet MS",Arial,sans-serif;letter-spacing:.005em}body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,transparent 0,transparent calc(50% - 460px),#b9d6c855 calc(50% - 460px),transparent calc(50% - 459px)),repeating-linear-gradient(0deg,transparent 0 31px,#c7ddd555 32px);opacity:.42}.app{max-width:1180px;margin:auto;padding:20px clamp(16px,4vw,48px) 48px}header{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;padding:5px 0 22px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:15px}.logo{display:grid;place-items:center;width:58px;height:58px;background:var(--deep);border:3px solid var(--ink);border-radius:14px;color:#eef7df;font-size:2rem;box-shadow:5px 5px 0 var(--orange);transform:rotate(3deg)}.brand h1{margin:0;font:700 clamp(2rem,4.5vw,3.8rem)/.92 Georgia,"Times New Roman",serif;letter-spacing:-.055em}.brand p{margin:8px 0 0;color:var(--muted);font-size:.92rem;letter-spacing:.035em}.tools,.nav,.cards,.choices,.actions,.meters{display:flex;gap:10px;flex-wrap:wrap}.tools button,.nav button,.choice,.primary,.secondary,.choice-btn{min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 16px;cursor:pointer;font:inherit;transition:background .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease}.tools button{min-height:40px;border-radius:999px;color:var(--muted);padding:7px 13px;background:transparent}.tools button:hover{color:var(--ink);border-color:var(--ink)}.nav{margin:22px 0 16px;padding:7px;background:#dfece6;border:1px solid #c2d8cc;border-radius:14px;box-shadow:0 4px 0 #bfd1c7}.nav button{flex:1;text-align:left;background:transparent;border-color:transparent;color:#46665e;font-weight:700}.nav button:hover{background:#ffffffaa;color:var(--ink)}.nav button[aria-current=true]{background:var(--deep);border-color:var(--deep);color:#fff;box-shadow:4px 4px 0 #a8c2b7}.panel{background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--line);border-radius:28px;padding:clamp(22px,4vw,48px);box-shadow:0 18px 45px #234d3d16;min-height:590px}.panel h2{margin:0 0 4px;font:700 clamp(2rem,4vw,3.8rem)/.98 Georgia,"Times New Roman",serif;letter-spacing:-.045em;text-wrap:balance}.prompt{max-width:720px;background:transparent;border-left:0;border-top:3px solid var(--leaf);padding:12px 0 0;margin:12px 0 28px;color:#49665f;font-size:1.06rem}.intro,.two{display:grid;grid-template-columns:minmax(220px,.72fr) minmax(0,1.28fr);gap:22px}.card{background:#eef5ee;border:1px solid #d2e3d6;border-radius:18px;padding:19px}.card strong{display:block;font-size:1.1rem;letter-spacing:.015em}.cards{margin:16px 0}.choice{flex:1;min-width:180px;text-align:left;background:#fbfcf8}.choice[aria-pressed=true],.choice-btn[aria-pressed=true]{border-color:var(--leaf);background:#dff1e5;box-shadow:inset 0 0 0 2px #82b99a}.choice:hover,.choice-btn:hover,.secondary:hover{border-color:var(--leaf);background:#f0f8f2}.choice .tag{font-weight:800;display:block}.choice small{color:var(--muted)}.choice-btn{min-width:110px}.primary{background:var(--leaf);border-color:var(--deep);color:#fff;box-shadow:4px 4px 0 var(--deep);font-weight:700}.primary:hover{background:#3a8f70;transform:translate(-1px,-1px)}.secondary{background:transparent;border-color:#a8beb4;color:var(--ink)}button:disabled{opacity:.43;cursor:not-allowed;box-shadow:none;transform:none}.actions{justify-content:space-between;align-items:center;margin-top:25px;padding-top:18px;border-top:1px solid var(--line)}.muted{color:var(--muted)}.feedback{min-height:44px;border-top:1px solid var(--line);padding-top:12px;margin-bottom:0;color:var(--good);font-weight:700}.feedback.bad{color:var(--bad)}.glossary{background:#fff5d4;border:1px solid #ebce77;border-left:5px solid var(--orange);border-radius:10px;padding:12px 15px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0;padding:18px;background:var(--ink);color:#eef7ef;border-radius:16px}.controls label{display:grid;gap:8px;font-weight:700}.controls input{width:100%;accent-color:var(--orange);min-height:32px}.meters{margin:18px 0}.meter{flex:1;min-width:160px;background:#eef5ee;border:1px solid #d2e3d6;border-radius:14px;padding:13px}.meter label{display:flex;justify-content:space-between;font-weight:700}.meter label b{font:700 1.5rem/1 Georgia,serif}.meter .bar{height:13px;border-radius:99px;background:#d9e5de;overflow:hidden;margin-top:10px}.meter i{display:block;height:100%;background:var(--water)}.meter.sun i{background:var(--orange)}.meter.plant i{background:var(--leaf)}.meter.animal i{background:var(--rose)}.result{border:1px solid #d2e3d6;border-radius:16px;padding:16px;background:#f5faf4}.result strong{font-size:1.2rem}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.summary .card{text-align:center}.summary .card strong{font:700 1.5rem/1 Georgia,serif;color:var(--deep)}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}@media(max-width:700px){.app{padding:14px 12px 32px}.brand h1{font-size:2.35rem}.intro,.two,.controls{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.panel{border-radius:20px;padding:22px 17px;min-height:0}.nav{overflow:auto;flex-wrap:nowrap}.nav button{min-width:132px}.choice{min-width:100%}}@media(prefers-reduced-motion:reduce){*,*::before,*:after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body><div class="app">
<header><div class="brand"><span class="logo" aria-hidden="true">🌿</span><div><h1>Living Ecosystem Lab</h1><p>Build a model, make a prediction, inspect what changes</p></div></div><div class="tools"><button id="replay" type="button">🔊 Replay prompt</button><button id="mute" type="button" aria-pressed="false">🔇 Mute</button><button id="reset" type="button">↻ Reset</button></div></header>
<nav class="nav" aria-label="Lab activities"><button data-view="start" aria-current="true">Start</button><button data-view="build">1 Build a habitat</button><button data-view="experiment">2 Predict and test</button><button data-view="restore">3 Restore balance</button></nav>
<main id="screen" aria-live="polite"></main><p id="status" role="status" style="position:absolute;left:-10000px"></p>
</div>
<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const organisms={producer:[["grass","Grass","needs light and water"],["clover","Clover","needs light and water"],["algae","Algae","needs light and water"]],herbivore:[["rabbit","Rabbit","eats grass or clover"],["caterpillar","Caterpillar","eats clover"],["snail","Snail","eats algae"]],predator:[["hawk","Hawk","hunts rabbits"],["fox","Fox","hunts rabbits"],["heron","Heron","hunts snails"]]};
const maps={rabbit:["grass","clover"],caterpillar:["clover"],snail:["algae"],hawk:["rabbit"],fox:["rabbit"],heron:["snail"]};
const scenarios=[["Meadow",70,70,"grass","rabbit","hawk"],["Shady edge",55,30,"clover","caterpillar","hawk"],["Rock pool",65,75,"algae","snail","heron"]];
const st={view:"start",muted:false,build:{producer:["grass","clover"],herbivore:["rabbit","caterpillar"],predator:["hawk"],ok:false},exp:{scene:0,water:70,light:70,pred:"",step:0,paused:false,result:null},restore:{water:25,light:40,producer:["algae"],herbivore:["snail"],predator:["heron"],ok:false}};
const prompts={start:"Welcome to the lab. We use a simple model to inspect relationships, not to copy every detail of nature.",build:"Choose organisms that can share one habitat. Explain what each one eats.",experiment:"Change one resource, predict what will happen, then advance one model step.",restore:"Diagnose the struggling habitat, repair a condition or food relationship, and test it.",complete:"You completed the ecosystem lab. Explain one model assumption to a grown-up."};
function say(t){if(st.muted||!("speechSynthesis" in window))return;speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}
function announce(t){$("#status").textContent=t}
function nav(){ $$("[data-view]").forEach(b=>b.setAttribute("aria-current",b.dataset.view===st.view?"true":"false"))}
function shell(title,body){return '<section class="panel"><h2>'+title+'</h2><p class="prompt">'+prompts[st.view]+'</p>'+body+'</section>'}
function common(){nav();$$("[data-view]").forEach(b=>b.onclick=()=>{st.view=b.dataset.view;render()});$("#replay").onclick=()=>say(prompts[st.view]);$("#mute").onclick=()=>{st.muted=!st.muted;$("#mute").setAttribute("aria-pressed",st.muted);$("#mute").textContent=st.muted?"🔇 Unmute":"🔇 Mute";announce(st.muted?"Read-aloud muted":"Read-aloud on")};$("#reset").onclick=()=>location.reload()}
function glossary(){return '<details class="glossary"><summary>Word helper</summary><p><b>Producer:</b> a plant or alga that makes food using light. <b>Herbivore:</b> an animal that eats producers. <b>Predator:</b> an animal that eats other animals. Arrows in this lab would mean energy moves from food to consumer.</p></details>'}
function start(){let body='<div class="intro"><div class="card"><strong>Mission</strong><p>Build a habitat, change water or sunlight, and restore a struggling model. The numbers are illustrative model values, not field measurements.</p><p>Everything runs on this page. There is no timer, score, login or learner data collection.</p></div><div class="card"><strong>For grown-ups</strong><p>Ask “What changed, and why?” Let the learner inspect each step. Real ecosystems are more complex than this bounded model.</p><p>Choose Pause, Step and Reset while exploring.</p></div></div>'+glossary()+'<div class="actions"><span class="muted">Three short activities, about 10–15 minutes.</span><button class="primary" id="begin" type="button">Start the lab</button></div>';$("#screen").innerHTML=shell("Ready to investigate?",body);$("#begin").onclick=()=>{st.view="build";render()};common()}
function pickCard(group,key,label,desc,selected){return '<button type="button" class="choice" data-pick="'+group+':'+key+'" aria-pressed="'+selected+'"><span class="tag">'+label+'</span><small>'+desc+'</small></button>'}
function build(){let body='<div class="card"><strong>Habitat: Meadow</strong><p>Choose at least two producers, two herbivores and one predator. The relationships must make sense: a consumer needs food, and the predator needs prey.</p></div>';for(const g of ["producer","herbivore","predator"]){body+='<h3>'+g.charAt(0).toUpperCase()+g.slice(1)+'s</h3><div class="cards">'+organisms[g].map(o=>pickCard(g,o[0],o[1],o[2],st.build[g].includes(o[0]))).join("")+'</div>'}body+=glossary()+'<p class="feedback">'+(st.build.ok?"Viable model habitat: the selected consumers have food and the predator has prey.":"Select organisms, then check the relationships.")+'</p><div class="actions"><button class="secondary" id="checkBuild" type="button">Check habitat</button><button class="primary" id="toExp" type="button" '+(st.build.ok?"":"disabled")+'>Continue</button></div>';$("#screen").innerHTML=shell("1. Build a habitat",body);$$("[data-pick]").forEach(b=>b.onclick=()=>{let [g,k]=b.dataset.pick.split(":");let a=st.build[g],i=a.indexOf(k);if(i<0)a.push(k);else a.splice(i,1);st.build.ok=false;render()});$("#checkBuild").onclick=()=>{let food=st.build.herbivore.some(h=>maps[h].some(p=>st.build.producer.includes(p)));let prey=st.build.predator.some(p=>maps[p].some(h=>st.build.herbivore.includes(h)));st.build.ok=st.build.producer.length>=2&&st.build.herbivore.length>=2&&st.build.predator.length>=1&&food&&prey;render()};$("#toExp").onclick=()=>{st.view="experiment";render()};common()}
function meter(name,value,klass){return '<div class="meter '+(klass||"")+'"><label><span>'+name+'</span><b>'+value+'</b></label><div class="bar"><i style="width:'+value+'%"></i></div></div>'}
function calc(){let resource=Math.round((st.exp.water+st.exp.light)/2),d=Math.round((resource-60)/15),plant=Math.max(0,Math.min(100,70+d*st.exp.step)),herb=Math.max(0,Math.min(100,65+(plant-70)*2)),pred=Math.max(0,Math.min(100,55+(herb-65)*2));return {plant,herb,pred,d}}
function experiment(){let sc=scenarios[st.exp.scene],r=calc(),body='<div class="choices" role="group" aria-label="Starting scenarios">'+scenarios.map((x,i)=>'<button type="button" class="choice-btn" data-scene="'+i+'" aria-pressed="'+(st.exp.scene===i)+'">'+x[0]+'</button>').join("")+'</div><div class="card"><strong>'+sc[0]+' · model values</strong><p>Starting relationship: '+sc[3]+' → '+sc[4]+' → '+sc[5]+'. The arrow means energy moves from food to consumer.</p></div><div class="controls"><label>Water <input id="water" type="range" min="0" max="100" value="'+st.exp.water+'"><span>'+st.exp.water+'%</span></label><label>Sunlight <input id="light" type="range" min="0" max="100" value="'+st.exp.light+'"><span>'+st.exp.light+'%</span></label></div><div class="meters">'+meter("Plants",r.plant,"plant")+meter("Herbivores",r.herb,"animal")+meter("Predator",r.pred,"animal")+'</div><div class="choices" role="group" aria-label="Prediction choices"><span class="muted">Prediction:</span>'+["plants","herbivores","predator"].map(x=>'<button type="button" class="choice-btn" data-pred="'+x+'" aria-pressed="'+(st.exp.pred===x)+'">'+x+' will '+(x==="plants"?"grow":x==="herbivores"?"change":"change")+'</button>').join("")+'</div><p class="feedback">'+(st.exp.result||"Record a prediction, then advance one step.")+'</p><div class="actions"><button class="secondary" id="pause" type="button">'+(st.exp.paused?"Resume":"Pause")+'</button><button class="secondary" id="step" type="button" '+(st.exp.paused?"":"")+(st.exp.pred?"":" disabled")+'>Advance one step</button><span class="muted">Step '+st.exp.step+' · Reset returns to the healthy start</span></div>';$("#screen").innerHTML=shell("2. Predict and test",body);$("#water").oninput=e=>{st.exp.water=+e.target.value;st.exp.result=null;render()};$("#light").oninput=e=>{st.exp.light=+e.target.value;st.exp.result=null;render()};$$("[data-scene]").forEach(b=>b.onclick=()=>{st.exp.scene=+b.dataset.scene;let s=scenarios[st.exp.scene];st.exp.water=s[1];st.exp.light=s[2];st.exp.step=0;st.exp.pred="";st.exp.result=null;render()});$$("[data-pred]").forEach(b=>b.onclick=()=>{st.exp.pred=b.dataset.pred;st.exp.result=null;render()});$("#pause").onclick=()=>{st.exp.paused=!st.exp.paused;render()};$("#step").onclick=()=>{if(st.exp.paused||!st.exp.pred)return;let before=calc();st.exp.step++;let after=calc();let observed=st.exp.pred==="plants"?after.plant-before.plant:st.exp.pred==="herbivores"?after.herb-before.herb:after.pred-before.pred;let trend=observed>0?"increased":observed<0?"decreased":"stayed about the same";st.exp.result="Step "+st.exp.step+": "+st.exp.pred+" "+trend+" by "+Math.abs(observed)+" model points. Cause: resource levels affect plants first, then available food affects consumers.";render()};common()}
function restore(){let valid=st.restore.water>=55&&st.restore.light>=45&&st.restore.producer.includes("algae")&&st.restore.herbivore.includes("snail")&&st.restore.predator.includes("heron");let body='<div class="card"><strong>Unfamiliar scenario: Rock pool after a dry week</strong><p>The pool is struggling. Repair the model by improving a resource and keeping a complete algae → snail → heron relationship.</p></div><div class="controls"><label>Water <input id="rwater" type="range" min="0" max="100" value="'+st.restore.water+'"><span>'+st.restore.water+'%</span></label><label>Sunlight <input id="rlight" type="range" min="0" max="100" value="'+st.restore.light+'"><span>'+st.restore.light+'%</span></label></div><h3>Organisms in the model</h3><div class="cards">'+pickCard("restoreProducer","algae","Algae","producer",st.restore.producer.includes("algae"))+pickCard("restoreHerbivore","snail","Snail","herbivore",st.restore.herbivore.includes("snail"))+pickCard("restorePredator","heron","Heron","predator",st.restore.predator.includes("heron"))+'</div><p class="feedback">'+(st.restore.ok?"The repaired model recovers because water supports algae, algae supports snails, and snails support the heron.":"Inspect the conditions and food chain before checking.")+'</p><div class="actions"><button class="secondary" id="repair" type="button">Check restoration</button><button class="primary" id="finish" type="button" '+(st.restore.ok?"":"disabled")+'>Finish lab</button></div>';$("#screen").innerHTML=shell("3. Restore balance",body);$("#rwater").oninput=e=>{st.restore.water=+e.target.value;st.restore.ok=false;render()};$("#rlight").oninput=e=>{st.restore.light=+e.target.value;st.restore.ok=false;render()};$$("[data-pick]").forEach(b=>b.onclick=()=>{let [g,k]=b.dataset.pick.split(":");let map={restoreProducer:"producer",restoreHerbivore:"herbivore",restorePredator:"predator"}[g],a=st.restore[map];if(a.includes(k))a.splice(a.indexOf(k),1);else a.push(k);st.restore.ok=false;render()});$("#repair").onclick=()=>{st.restore.ok=valid;render()};$("#finish").onclick=()=>{st.view="complete";render()};common()}
function complete(){let body='<div class="big" aria-hidden="true">🌎</div><h2>Lab complete!</h2><p>You built relationships, tested a deterministic model, and repaired an unfamiliar habitat.</p><div class="summary"><div class="card"><strong>Food relationships</strong><span>producer → consumer → predator</span></div><div class="card"><strong>Model rule</strong><span>resources affect plants first</span></div><div class="card"><strong>Next practice</strong><span>invent a new “what if?”</span></div></div><p>Real ecosystems have many interacting conditions. This bounded model is for explaining one relationship at a time.</p><button class="primary" id="again" type="button">Play again</button>';$("#screen").innerHTML=shell("You did it!",body);$("#again").onclick=()=>location.reload();common()}
function render(){nav();if(st.view==="start")start();else if(st.view==="build")build();else if(st.view==="experiment")experiment();else if(st.view==="restore")restore();else complete();say(prompts[st.view]);announce(prompts[st.view])}
render();
})();
</script></body></html>
